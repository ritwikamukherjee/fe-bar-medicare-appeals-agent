<!doctype html><html><head><meta charset='utf-8'><style>html,body{background:#fff;margin:0;}.stage{width:1280px;min-height:720px;box-sizing:border-box;padding:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;}.stage>*{width:100%;}</style></head><body><div class='stage'>
<div class="bnr-wrap">

</style>
<div class="ds-banner info">
  <div class="ds-banner-icon">&#9906;</div>
  <div>
    <div class="ds-banner-title">Lakebase Search: Contextual Lookup for Appeals &amp; Grievances</div>
    <div class="ds-banner-tagline">Semantic + keyword + hybrid retrieval inside the operational Postgres that already powers your app &mdash; no separate search cluster, no ETL out of your system of record.</div>
  </div>
</div>
</div>
</div></body></html>
